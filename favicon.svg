<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Voiture rose sur route lavande">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6E8F6"/>
      <stop offset=".44" stop-color="#D8C7EF"/>
      <stop offset="1" stop-color="#B7A2E2"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx=".38" cy=".26" r=".75">
      <stop offset="0" stop-color="#FFF3ED" stop-opacity=".9"/>
      <stop offset=".62" stop-color="#F2CDE7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#EABAE2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#554565"/>
      <stop offset=".5" stop-color="#352B4B"/>
      <stop offset="1" stop-color="#251F39"/>
    </linearGradient>
    <linearGradient id="roadRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A993D5"/>
      <stop offset=".32" stop-color="#D6C0EE"/>
      <stop offset="1" stop-color="#9A85C7"/>
    </linearGradient>
    <linearGradient id="pinkBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC1B7"/>
      <stop offset=".22" stop-color="#FF8E9B"/>
      <stop offset=".54" stop-color="#FB788D"/>
      <stop offset=".84" stop-color="#E65D77"/>
      <stop offset="1" stop-color="#CE496D"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAAB2"/>
      <stop offset=".55" stop-color="#FC7D92"/>
      <stop offset="1" stop-color="#EE667E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E7FF"/>
      <stop offset=".4" stop-color="#B7B5E8"/>
      <stop offset="1" stop-color="#6F78B3"/>
    </linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".58" stop-color="#FFFBE4"/><stop offset=".88" stop-color="#FFE1A8"/><stop offset="1" stop-color="#EAA88F"/></radialGradient>
    <filter id="shadow" x="-60%" y="-50%" width="220%" height="230%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="round"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Gentle lavender UI background, in keeping with the app's pastel palette. -->
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="12" cy="23" r="49" fill="url(#pinkGlow)"/>
    <circle cx="119" cy="100" r="39" fill="#F5CDEB" opacity=".34"/>
    <path d="M-16 57 Q3 26 25 16 M102 119 Q124 106 144 92" fill="none" stroke="#FFF9FF" stroke-width="2" opacity=".63"/>
    <!-- Soft road bevel and deep-plum carriageway. -->
    <rect x="24.5" y="-7" width="79" height="147" rx="20" fill="#49345C" opacity=".25" filter="url(#shadow)"/>
    <rect x="27" y="-8" width="74" height="144" rx="19" fill="url(#roadRim)"/>
    <rect x="30.5" y="-8" width="67" height="144" rx="16" fill="url(#road)"/>
    <path d="M35 0v128" stroke="#A698C0" opacity=".15" stroke-width="1.5"/>
    <path d="M92 0v128" stroke="#FAE9FF" opacity=".12" stroke-width="1.5"/>
    <path d="M64 0v128" stroke="#DCCBED" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="9 12" opacity=".8"/>
    <!-- Floating shadow under the toy-like car. -->
    <rect x="41.5" y="32" width="45" height="67" rx="20" fill="#130F20" opacity=".44" filter="url(#shadow)"/>
    <!-- Tires, clearly visible at favicon size. -->
    <rect x="40" y="43" width="8.5" height="19" rx="3.5" fill="#252132" stroke="#4F4053" stroke-width="1.2"/>
    <rect x="79.5" y="43" width="8.5" height="19" rx="3.5" fill="#252132" stroke="#4F4053" stroke-width="1.2"/>
    <rect x="40" y="75" width="8.5" height="18" rx="3.5" fill="#252132" stroke="#4F4053" stroke-width="1.2"/>
    <rect x="79.5" y="75" width="8.5" height="18" rx="3.5" fill="#252132" stroke="#4F4053" stroke-width="1.2"/>
    <!-- Curved coral car body with a high-gloss candy finish. Front faces upward. -->
    <rect x="43.5" y="32" width="41" height="65" rx="18" fill="url(#pinkBody)" stroke="#BE4D72" stroke-width="1.6"/>
    <path d="M47 48 Q47 35 58 35 H68 Q81 35 81 49" fill="none" stroke="#FFDAD1" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
    <path d="M47 78 Q47 91 57 93 H70 Q79 93 81 82" fill="none" stroke="#E44E6B" stroke-width="2.3" opacity=".6"/>
    <!-- Front bonnet, rounded bumper and windshield. -->
    <path d="M49 46 Q49 40 55 39 H73 Q79 40 79 46" fill="none" stroke="#FDE4DE" opacity=".55" stroke-width="1.5"/>
    <rect x="50" y="49.5" width="28" height="12" rx="4.6" fill="url(#glass)" stroke="#7D6C9E" stroke-width="1"/>
    <path d="M53 53 Q61 50 72 52" fill="none" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Raised, softly illuminated roof. -->
    <rect x="49.6" y="63" width="28.8" height="20" rx="8.5" fill="url(#roof)" stroke="#E66D80" stroke-width=".8"/>
    <path d="M54 65 Q56 64 64 64 H72" fill="none" stroke="#FFE4DA" stroke-width="1.6" opacity=".76" stroke-linecap="round"/>
    <rect x="50" y="82.7" width="28" height="8.7" rx="3.8" fill="url(#glass)" stroke="#887BA9" stroke-width=".9"/>
    <path d="M53 85 Q63 83 73 85" fill="none" stroke="#FFFFFF" stroke-opacity=".59" stroke-width="1.35"/>
    <!-- Side mirrors. -->
    <ellipse cx="42.8" cy="65" rx="3.3" ry="5" fill="#F5839A" stroke="#C35576" stroke-width="1"/>
    <ellipse cx="85.2" cy="65" rx="3.3" ry="5" fill="#F5839A" stroke="#C35576" stroke-width="1"/>
    <!-- Main illuminated headlights and small taillights. -->
    <circle cx="51" cy="38.5" r="5.1" fill="url(#lamp)" stroke="#D0A19E" stroke-width="1.1"/>
    <circle cx="77" cy="38.5" r="5.1" fill="url(#lamp)" stroke="#D0A19E" stroke-width="1.1"/>
    <ellipse cx="49.8" cy="90.8" rx="3.1" ry="3.5" fill="#C43A61" stroke="#FFB3B8" stroke-width="1"/>
    <ellipse cx="78.2" cy="90.8" rx="3.1" ry="3.5" fill="#C43A61" stroke="#FFB3B8" stroke-width="1"/>
    <!-- Front mini emblem, sufficient visual identity without adding typography. -->
    <path d="M58 44.5h12" stroke="#FDE5D9" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="64" cy="44.5" r="1.6" fill="#F9D9DB" stroke="#D97789" stroke-width=".65"/>
  </g>
  <rect x=".65" y=".65" width="126.7" height="126.7" rx="29.4" fill="none" stroke="#FFF9FF" opacity=".4" stroke-width="1.3"/>
</svg>
